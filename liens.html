<style>
@font-face{font-family:"Geist";src:url(fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--g:#4ce05e;--s:#a1d193;--ink:#fff;--ink2:rgba(255,255,255,.62);--line:rgba(241,236,228,.14);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#1b1917;color:var(--ink);font:400 16px/1.5 "Geist",system-ui,sans-serif}
body{min-height:100dvh;display:flex;justify-content:center;padding:56px 20px 40px;background:radial-gradient(40rem 30rem at 50% -10rem,rgba(255,236,210,.14),transparent 70%),radial-gradient(18rem 16rem at 50% 7rem,rgba(161,209,147,.08),transparent 70%),linear-gradient(180deg,#22201d,#181614)}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
.av{width:128px;height:128px;border-radius:50%;display:block;overflow:hidden;background:#000;box-shadow:0 20px 50px -20px rgba(0,0,0,.9)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin-top:18px;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:2.4rem;line-height:1;letter-spacing:0}
.handle{margin-top:6px;color:var(--ink2);font-size:.95rem}
.links{margin-top:30px;width:100%;display:grid;gap:14px}
.lk{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 20px;border-radius:18px;text-decoration:none;color:var(--ink);transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s var(--ease)}
.lk:active{transform:scale(.985)}
.lk span{flex:1}
.lk b{display:block;font-weight:650;font-size:1.06rem;line-height:1.3}
.lk small{display:block;margin-top:3px;font-size:.88rem;color:var(--ink2)}
.lk i{font-style:normal;font-size:1.2rem;opacity:.7}
/* bouton 1 : l'ame Oui Dreams, cadre vert neon */
.lk.main{background:rgba(21,19,17,.75);box-shadow:0 0 0 1.5px var(--s),0 14px 40px -18px rgba(0,0,0,.8)}
.lk.main:hover{background:rgba(161,209,147,.08);box-shadow:0 0 0 1.5px var(--s),0 14px 40px -18px rgba(0,0,0,.8)}
.lk.main .tag{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:999px;background:var(--s);color:#1b1917;font-size:.75rem;font-weight:700;letter-spacing:.02em}
.lk.main i{color:var(--s);opacity:1}
/* bouton 2 : plus discret */
.lk.alt{background:rgba(255,255,255,.04);box-shadow:0 0 0 1px var(--line)}
.lk.alt:hover{background:rgba(255,255,255,.07)}
.soc{margin-top:22px;display:flex;gap:10px}
.soc a{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--ink2);box-shadow:0 0 0 1px var(--line);transition:color .3s var(--ease),box-shadow .3s var(--ease)}
.soc svg{width:22px;height:22px}
.soc a:hover{box-shadow:0 0 0 1px var(--s)}
.soc a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--s);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes glow{50%{filter:drop-shadow(0 0 3px rgba(76,224,94,.3)) drop-shadow(0 0 10px rgba(76,224,94,.14))}}
  main>*{animation:up .8s var(--ease) both}.soc{animation-delay:.08s}.links{animation-delay:.16s}
}
.lk b.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:1.65rem;line-height:1.05;letter-spacing:-.005em}
.lk b.serif em{font-style:italic;color:var(--s)}
</style>
</head>
<body>

  <nav class="links" aria-label="Liens">

  </nav>

</html>
