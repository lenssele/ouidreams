<style>
@font-face{font-family:"Geist";src:url(fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--ink:#f1ece4;--ink2:#b9b2a8;--ink3:#857f77;--sage:#a1d193;--line:rgba(241,236,228,.10);--line2:rgba(241,236,228,.18);--card:rgba(241,236,228,.04);--serif:"Instrument Serif",Georgia,serif;--ease:cubic-bezier(.16,1,.3,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:#1b1917;color:var(--ink);font:400 17px/1.55 "Geist",system-ui,sans-serif;scroll-behavior:smooth}
body{background:radial-gradient(48rem 34rem at 50% -14rem,rgba(255,236,210,.13),transparent 70%),linear-gradient(180deg,#22201d,#1b1917 40%,#181614);background-attachment:fixed}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(2.8rem,9vw,5.2rem)}
h2{font-size:clamp(2.1rem,5.5vw,3.4rem)}
p{max-width:60ch}
em{font-style:italic;color:var(--sage)}
section{padding:80px 0}
.top{display:flex;align-items:center;justify-content:space-between;height:68px}
.top img{width:132px;height:auto;filter:grayscale(1) brightness(1.6);opacity:.85}
.back{font-size:.9rem;color:var(--ink2);text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 0 0 1px var(--line2)}
.back:hover{color:var(--ink)}
.hero{padding:20px 0 70px}
.hero .wrap.solo{display:flex;gap:0;flex-direction:column;align-items:center;text-align:center}
.solo .cover{width:100%;max-width:380px;transform:none}
.solo .proof{margin-top:22px}
.solo .rgpd{margin:14px auto 0}
.hero .wrap{display:grid;gap:44px;align-items:center}
.free{display:inline-block;margin-bottom:18px;padding:8px 16px;border-radius:999px;background:var(--sage);color:#1b1917;font-weight:700;font-size:1rem}
.proof{margin-top:18px;font-size:1rem;color:var(--ink)}
.proof b{font-weight:700}
.lead{margin-top:14px;font-size:1.15rem;color:var(--ink2)}
.dl{display:inline-flex;align-items:center;height:56px;padding:0 28px;border-radius:999px;background:var(--ink);color:#1b1917;font-weight:600;text-decoration:none}
.dl:hover{background:#fff}
.go{margin-top:26px}
.note{margin-top:10px;font-size:.88rem;color:var(--ink3)}
.rgpd{margin-top:14px;max-width:46ch;font-size:.78rem;line-height:1.5;color:var(--ink3)}
.cover{max-width:400px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px var(--line2),0 40px 90px -30px rgba(0,0,0,.9);transform:rotate(-1.5deg)}
.kicker{font-size:.95rem;font-weight:600;color:var(--sage);margin-bottom:14px}
.steps{margin-top:40px;list-style:none;display:grid;gap:0;border-top:1px solid var(--line);counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:4px 16px;padding:18px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);grid-row:span 2;font-family:var(--serif);font-size:1.9rem;line-height:1;color:var(--sage)}
.steps b{font-weight:600}
.steps span{color:var(--ink2)}
.pages{margin-top:44px;display:grid;gap:18px;grid-template-columns:1fr 1fr}
.pages img{border-radius:14px;box-shadow:0 0 0 1px var(--line2)}
.pages figcaption{margin-top:10px;font-size:.88rem;color:var(--ink3)}
.mc{margin-top:0;padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
.mc .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.mc p{color:var(--ink2);max-width:70ch}
.mc b{color:var(--ink);font-weight:600}
.pill{padding:6px 14px;border-radius:999px;box-shadow:0 0 0 1px var(--sage);color:var(--sage);font-weight:600;font-size:.9rem;white-space:nowrap}
.final{text-align:center}
.final p{margin:16px auto 0;color:var(--ink2)}
footer{padding:40px 0 56px;border-top:1px solid var(--line);color:var(--ink3);font-size:.88rem}
footer a{color:var(--ink2)}
@media (min-width:860px){
  .wrap{padding:0 40px}
  .hero .wrap{grid-template-columns:1.1fr .9fr;gap:60px}
  .pages{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:no-preference){@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.hero .wrap>*{animation:up .9s var(--ease) both}.hero .wrap>*:nth-child(2){animation-delay:.12s}}
</style>
</head>

<main>
<section class="hero">
  <div class="wrap solo">
    <div class="cover"><img src="v/guide/page1.jpg?v=20261023" alt="Guide gratuit : Comment je crée mes vidéos Oui Dreams" width="720" height="900"></div>
    <p class="proof">Par Hugo, créateur de Oui Dreams · <b>410&nbsp;000 abonnés</b></p>
    <p class="go"><a class="dl" href="https://contact-ouidreams.systeme.io/guide">Recevoir le guide gratuit</a></p>
    <p class="rgpd">Responsable : Lyciara, EI Hugo Lancel. <a href="confidentialite.html">Confidentialité</a></p>
  </div>
</section>
</main>
<footer><div class="wrap">Oui Dreams</div></footer>
</body>
</html>
